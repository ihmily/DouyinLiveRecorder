# =============================================================================
# DouyinLiveRecorder Docker Compose 配置
# 支持抖音、TikTok、YouTube等60+平台直播录制工具
# =============================================================================

services:
  # 直播录制服务
  recorder:
    build:
      context: .
      dockerfile: Dockerfile
    image: ihmily/douyin-live-recorder:latest

    container_name: douyin-live-recorder

    # 环境变量配置
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONIOENCODING=utf-8
      - TZ=Asia/Shanghai
      - TERM=xterm-256color

    # 交互式终端支持
    tty: true
    stdin_open: true

    # 卷挂载配置
    volumes:
      # 配置文件（必需）
      - ./config:/app/config:rw
      # 下载目录（必需）
      - ./downloads:/app/downloads:rw
      # 日志目录
      - ./logs:/app/logs:rw
      # 配置备份目录
      - ./backup_config:/app/backup_config:rw

    # 端口映射（用于 Web UI 或调试）
    ports:
      - "8000:8000"

    # 重启策略
    restart: unless-stopped

    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # 资源限制（可选）
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    # 网络模式
    network_mode: bridge

# 网络配置
networks:
  default:
    name: douyin-recorder-network
    driver: bridge
