# =============================================================================
# DouyinLiveRecorder Docker Compose 配置
# 支持抖音、TikTok、YouTube等60+平台直播录制工具
#
# 三种运行模式（服务）：
#   recorder（默认）  命令行录制模式         docker compose up -d
#   web（profile）    Web 管理面板模式       docker compose --profile web up -d
#   gui（profile）    GUI 模式（需 X11）     docker compose --profile gui up -d
#
# 可在此文件同目录下创建 .env 文件覆盖默认环境变量（compose 自动加载），
# 例如：TZ=America/New_York 可修改时区。
# =============================================================================

services:
  # ---------------------------------------------------------------
  # 主录制服务 - 持续监测并录制直播（main.py，纯命令行，不监听端口）
  # ---------------------------------------------------------------
  recorder: &recorder
    image: ihmily/douyin-live-recorder:latest
    container_name: douyin-live-recorder

    build:
      context: .
      dockerfile: Dockerfile
      # 版本号从 pyproject.toml 动态注入；可在 .env 中设置 APP_VERSION，
      # 不设置则镜像 LABEL 的 version 为空（镜像内版本仍由 pyproject.toml / main.py 在运行时读取）
      args:
        APP_VERSION: "${APP_VERSION}"

    # 环境变量
    environment:
      # Python 运行时
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONIOENCODING=utf-8
      # 时区
      - TZ=Asia/Shanghai
      # 终端
      - TERM=xterm-256color

    # 从 .env 文件加载环境变量（如果存在）
    env_file:
      - path: .env
        required: false

    # 交互式终端支持（可在容器内使用 Ctrl+C 停止录制）
    tty: true
    stdin_open: true

    # 卷挂载
    volumes:
      # 配置文件目录（必需）- 包含 config.ini 和 URL_config.ini
      - ./config:/app/config:rw
      # 录制文件下载目录（必需）
      - ./downloads:/app/downloads:rw
      # 运行日志目录
      - ./logs:/app/logs:rw
      # 配置备份目录
      - ./backup_config:/app/backup_config:rw

    # 重启策略：除非手动停止，否则自动重启
    restart: unless-stopped

    # 健康检查：同时兼容 main.py 与 web.py 两种模式
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python (main|web).py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # 日志限制
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ---------------------------------------------------------------
  # Web 管理面板模式（web.py = 录制引擎守护线程 + FastAPI/uvicorn）
  # 启动：docker compose --profile web up -d
  # 重要：web.py 默认监听 127.0.0.1:8000，容器内必须在
  #   config/config.ini 的 [Web] 节设置 web_host = 0.0.0.0，
  #   宿主机才能通过 http://localhost:8000 访问面板。
  #   若监听 0.0.0.0，强烈建议同时设置 web_auth_enable = true 并配置密码。
  # ---------------------------------------------------------------
  web:
    <<: *recorder
    container_name: douyin-live-recorder-web
    profiles:
      - web
    entrypoint: ["python", "web.py"]
    # 端口映射仅 Web 模式需要（宿主机:容器）
    ports:
      - "8000:8000"

  # ---------------------------------------------------------------
  # GUI 模式服务（需要 X11 或 Wayland 显示环境）
  # 启动：docker compose --profile gui up -d
  # 前置条件：
  #   1. 宿主机运行：xhost +local:
  #   2. 取消下方 DISPLAY 和 X11 socket 的注释
  # ---------------------------------------------------------------
  gui:
    <<: *recorder
    container_name: douyin-live-recorder-gui
    profiles:
      - gui
    entrypoint: ["python", "gui.py"]
    # GUI 模式实际运行 python gui.py，健康检查需匹配 gui.py 而非 main|web.py
    # （继承的 recorder 健康检查以 'python (main|web).py' 为判定，对 gui 模式永远失败）
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python gui.py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # environment:
    #   - DISPLAY=${DISPLAY}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix:rw
