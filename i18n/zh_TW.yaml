  ① 讀寫全部設定（僅「自訂腳本執行命令」被禁止）；② 讀取 logs 下的執行日誌；③ 遍歷並下載 downloads 下全部錄製檔案；④ 增刪改直播間並可提交任意地址（存在被用作內網探測跳板的風險）；⑤ 啟停錄製。

  建議立即在 config.ini [Web] 節設定 web_auth_enable = true 並設定 web_password，然後刪除環境變數 DOUYIN_WEB_ALLOW_INSECURE 並重啟。

  另請注意（M-10）：繫結 0.0.0.0/:: 的遠端部署下，寫操作另受 Origin 同源校驗約束——未在 config.ini 的 web_allowed_hosts 登記存取用主機名稱/IP 時，面板會「讀得到、寫不了」；該登記須手工編輯 config.ini 完成。'
