name: Build and Push to GHCR

# 推送到 GitHub 后自动构建镜像，推到 GitHub 自带的容器仓库（ghcr.io）。
# 用仓库内置的 GITHUB_TOKEN 认证，不需要另外配置 Docker Hub 账号密码。
# 群晖 Container Manager 里直接填 ghcr.io/zltelaii/douyin-live-recorder:latest 即可拉取。

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: '目标架构（群晖绝大多数是 amd64；ARM 机型填 linux/arm64）'
        required: false
        default: 'linux/amd64'
      tag:
        description: '镜像标签'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/zltelaii/douyin-live-recorder

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag || 'latest' }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
