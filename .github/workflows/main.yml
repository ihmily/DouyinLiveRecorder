# DouyinLiveRecorder 可执行文件构建与发布工作流
#
# 触发方式：
#   1. 手动触发（workflow_dispatch）：构建三平台产物并上传 artifact
#   2. 推送 v* 标签（如 v4.0.8）：构建 + 自动创建 GitHub Release 并附上产物
#
# 构建逻辑统一由仓库根目录的 build_exe.py 承担（本地与 CI 行为一致）。

name: Build Executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 冒烟测试需要 ffmpeg（main.py 启动即检查）。
      # Windows 产物自带仓库内 ffmpeg.exe；Linux/macOS 用系统包管理器安装。
      # Linux 额外安装 xvfb：GUI（tkinter/pystray）冒烟测试需要虚拟显示。
      - name: Install ffmpeg + xvfb (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Install ffmpeg (macOS)
        if: matrix.platform == 'macos'
        run: brew install ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executables + smoke test (Linux, xvfb)
        if: matrix.platform == 'linux'
        run: xvfb-run -a python build_exe.py --smoke

      - name: Build executables + smoke test
        if: matrix.platform != 'linux'
        run: python build_exe.py --smoke

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouyinLiveRecorder-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          draft: false
