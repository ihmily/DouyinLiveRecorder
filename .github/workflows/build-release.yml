# =============================================================================
# Build & Release —— 三平台可执行文件构建与 GitHub Release 发布
# -----------------------------------------------------------------------------
# 触发条件：
#   1. push tag `v*`（如 v4.0.8.2）→ 构建三平台产物 + 自动创建 GitHub Release
#   2. workflow_dispatch（手动）    → 默认仅构建并上传 artifact；勾选 create_release 输入后亦创建 Release
#
# 构建逻辑统一由仓库根目录 build_exe.py 承担（本地 / CI 行为一致）：
#   · --dual   PyInstaller 只跑一次，先产 lite（不含运行时）再产 full（含 ffmpeg+node）
#   · --smoke  对打出的 CLI / Web / GUI 三个入口依次做启动冒烟
#   产物命名：dist/DouyinLiveRecorder-v<版本>-<os>-<arch>{-lite,-full}.zip
#   · 网络安装（choco / apt / brew / pip）统一经 .github/actions/retry 复合动作
#     包装（线性退避重试），与 ci.yml 共用同一实现——重试策略调整只改 action.yml 一处。
#
# 版本号事实源：pyproject.toml [project].version（唯一）。
#   main.py / src/web_api.py 运行时经 importlib.metadata 读取；
#   Dockerfile 经 APP_VERSION 构建参数注入；
#   本工作流的 prepare job 负责「提取 + 校验 tag 与之一致」，不一致直接失败，
#   从根上避免「打了 v4.0.9 的 tag 却发布出 4.0.8.2 的包」。
#
# ---------------------------------------------------------------------------
# 环境变量与 Secrets 说明
# ---------------------------------------------------------------------------
#   · secrets.GITHUB_TOKEN  —— Actions 自动注入，**无需手工配置**。
#                              softprops/action-gh-release 默认读取它来创建 Release，
#                              因此本文件不显式传 `token:`；权限通过 release job 的
#                              `permissions: contents: write` 授予（其余 job 只读）。
#   · HOMEBREW_NO_REQUIRE_TAP_TRUST —— 仅 macOS job 使用，绕过 GitHub macOS runner
#                              预置的未受信 aws/tap 导致的 brew 报错。
#   · PYTHONUTF8            —— 由 build_exe.py 内部 _ensure_utf8_streams() 自行设置，
#                              避免 Windows runner cp1252 控制台输出中文日志崩溃。
#   如需代码签名（Windows Authenticode / macOS codesign & notarize），
#   再新增 secrets.WINDOWS_CERT_PFX_BASE64 / APPLE_ID / APPLE_APP_PASSWORD 等，
#   并在对应平台的构建步骤后追加签名步骤。当前发布**未签名**。
# =============================================================================

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "手动触发时是否创建 GitHub Release（默认 false：仅构建并上传 artifact）"
        type: boolean
        default: false

# 默认最小权限；仅 release job 单独提升为 contents: write
permissions:
  contents: read

# 发布类流水线不允许「取消进行中的运行」（半途取消会产出不完整的 Release），
# 与 ci.yml 的 cancel-in-progress: true 策略有意区分。
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 0. 版本提取与一致性校验 ──────────────────────────────────────────────
  prepare:
    name: Prepare (version & constants)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
      # 与 ci.yml 保持一致的运行环境常量（单一事实源，改一处即全局生效）
      python_build: ${{ steps.consts.outputs.python_build }}
      node_version: ${{ steps.consts.outputs.node_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Declare shared constants
        id: consts
        shell: bash
        run: |
          set -euo pipefail
          # python_build : 打包解释器版本（3.14，与 ci.yml 的 python_build 同值）——
          #                发布二进制的解释器一经验证不轻易变更；
          #                ci.yml 的 build-verify job 使用同一版本，保证验证环境 == 发布环境。
          # node_version : 与 ci.yml 同值；供冒烟测试期间 JS 签名脚本可用
          #                （full 版本内置的 node 由 build_exe.py 自行下载，与此无关）。
          {
            echo "python_build=3.14"
            echo "node_version=24"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # 用 tomllib（3.11+ 标准库）解析，避免正则误匹配
      - name: Extract version from pyproject.toml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          if [ -z "$VERSION" ]; then
            echo "::error::未能从 pyproject.toml 解析出 [project].version"
            exit 1
          fi
          echo "版本号（pyproject.toml）: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            TAG_VERSION="${TAG#v}"
            echo "推送的 tag: ${TAG}（去 v 前缀: ${TAG_VERSION}）"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::tag 与 pyproject.toml 版本不一致：tag=${TAG_VERSION} pyproject=${VERSION}。请先用 scripts/sync_version.py 同步版本再重新打 tag。"
              exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "手动触发（非 tag）：默认仅构建并上传 artifact；勾选 create_release 输入可额外创建 Release"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      # 复用 CI 同一脚本，确保各消费方仍是「动态读取」而非写死版本号
      - name: Check version consistency across consumers
        run: python scripts/check_version.py

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "### 构建版本"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本号 | \`${{ steps.version.outputs.version }}\` |"
            echo "| 触发方式 | \`${{ github.event_name }}\` |"
            echo "| 创建 Release | \`${{ steps.version.outputs.is_release }}\` |"
            echo "| 打包 Python | \`${{ steps.consts.outputs.python_build }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 0.5 预创建 Release（消除 build job 并发创建竞态）──────────────────
  # 仅建立 Release 记录，build job 随后并发把 6 个 zip 追加为附件，
  # 不会出现「多个 build job 同时创建同一 Release」的竞态。
  # 注意：job 级不挂 if（否则被 skip 后会级联 skip 依赖它的 build），
  #       是否真正创建由步骤级 if 控制。
  release-create:
    name: Create Release (preallocate)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # 手动发版路径需要 git 仓库来打/推 tag（Ensure git tag exists 步骤）。
      # 若无 checkout，runner 无 .git 目录，git 命令直接报
      # "fatal: not in a git directory"（exit 128）。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip (non-release path)
        if: >-
          needs.prepare.outputs.is_release != 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        shell: bash
        run: echo "非发版路径，跳过预创建 Release"

      # GitHub Release 必须挂在 tag 上。tag 推送路径下 tag 已存在；
      # 但手动触发 + create_release 路径（文档明确支持）没有 tag，github.ref 是分支，
      # 若不在此创建轻量 tag，后续 build 上传 / release job 的 `gh release download vX.Y.Z`
      # 会因找不到对应 tag 的 Release 而失败。故在单例的 release-create job 中创建，
      # 避免多平台 build job 并发推送 tag 引发竞态。
      - name: Ensure git tag exists (manual release path)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.create_release == true &&
          needs.prepare.outputs.is_release != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ needs.prepare.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag ${TAG} 已存在，跳过创建"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Preallocate GitHub Release
        if: >-
          needs.prepare.outputs.is_release == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v3
        with:
          # 显式指定 tag_name：不依赖 action 从 github.ref 推断（手动分支触发时会误挂到分支），
          # 保证 release-create / build 上传 / release 收尾三处指向同一个 Release。
          tag_name: v${{ needs.prepare.outputs.version }}
          # 仅建记录，不传 files；body/notes 由 release job 的 Finalize 收尾统一写
          name: v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false

  # ── 1. 三平台构建 + 冒烟 ─────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    needs: [prepare, release-create]
    runs-on: ${{ matrix.os }}
    # full 版本需下载 ffmpeg + node（约 300MB）并压缩，Windows/macOS 明显更慢，
    # 故给 90 分钟上限：既能兜住慢网络，又不会在卡死时白烧 6 小时默认额度。
    timeout-minutes: 90
    # 发版路径下 build job 需直传 GitHub Release（contents: write）；
    # 仅构建路径只用 upload-artifact，多授予的写权限无副作用。
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ needs.prepare.outputs.python_build }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.prepare.outputs.python_build }}
          # 无 lock 文件，缓存 key 以 requirements.txt + pyproject.toml 的 hash 为准
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # 冒烟测试期间 JS 签名脚本可能需要 node（src/javascript/*.js 由 exejs 调起）
      - name: Setup Node.js ${{ needs.prepare.outputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.prepare.outputs.node_version }}

      # ── ffmpeg：冒烟测试需要（main.py 启动即检查）──────────────────────
      # 冒烟跑在 lite 产物上（不含内置运行时），故三平台都用系统包管理器装一份。
      # full 版本内置的 ffmpeg 由 build_exe.py --dual 在打包阶段单独下载。
      # Linux 额外装 xvfb：GUI（tkinter/pystray）冒烟需要虚拟显示。
      - name: Install ffmpeg (Windows)
        if: matrix.platform == 'windows'
        uses: ./.github/actions/retry
        with:
          label: choco 安装 ffmpeg
          backoff: "15"
          command: choco install ffmpeg -y --no-progress

      - name: Install ffmpeg + xvfb (Linux)
        if: matrix.platform == 'linux'
        uses: ./.github/actions/retry
        with:
          label: apt 安装 ffmpeg/xvfb
          backoff: "15"
          command: >-
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq -o Acquire::Retries=3
            && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
            -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold
            --no-install-recommends ffmpeg xvfb

      # GitHub 的 macOS runner 预置了未受信的 aws/tap，Homebrew 新的 tap 信任机制
      # 会因此报错。先显式信任该 tap（幂等、失败不阻断，无需重试），安装步骤内的
      # HOMEBREW_NO_REQUIRE_TAP_TRUST=1 再兜底关闭整个校验。
      # HOMEBREW_* 写在命令内而非 step env：复合动作对调用方 step 级 env 的可见性
      # 无官方保证，显式 export 行为最确定。
      - name: Trust preinstalled Homebrew tap (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1 HOMEBREW_NO_AUTO_UPDATE=1
          brew trust aws/tap || true

      - name: Install ffmpeg (macOS)
        if: matrix.platform == 'macos'
        uses: ./.github/actions/retry
        with:
          label: brew 安装 ffmpeg
          backoff: "15"
          command: >-
            export HOMEBREW_NO_REQUIRE_TAP_TRUST=1 HOMEBREW_NO_AUTO_UPDATE=1
            && brew install ffmpeg

      # PyInstaller 来自 pyproject [project.optional-dependencies].build，
      # 不写死版本，保持与项目声明一致（>=6.10.0）。
      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          label: pip 安装依赖（requirements + build extras）
          command: >-
            python -m pip install --upgrade pip
            && pip install -r requirements.txt
            && pip install ".[build]"

      - name: Build executables + smoke test (Linux, xvfb)
        if: matrix.platform == 'linux'
        run: xvfb-run -a python build_exe.py --smoke --dual

      - name: Build executables + smoke test
        if: matrix.platform != 'linux'
        run: python build_exe.py --smoke --dual

      - name: List build output
        shell: bash
        run: ls -lh dist/

      # ── 产物发布 ───────────────────────────────────────────────────────
      # 发版路径（tag 推送 / 手动勾选 create_release）：
      #   直接用 softprops/action-gh-release 把 zip 直传 GitHub Release，
      #   去掉原 upload-artifact → download-artifact 的来回。首个完成的
      #   build job 会自动创建 Release，其余并发追加附件（GitHub 支持同 Release
      #   并发上传不同 asset）。
      - name: Upload to GitHub Release
        if: >-
          needs.prepare.outputs.is_release == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v3
        with:
          # 显式指定 tag_name，与 release-create / release 收尾三处保持一致，
          # 避免手动分支触发时误挂到分支 ref
          tag_name: v${{ needs.prepare.outputs.version }}
          files: |
            dist/*-lite.zip
            dist/*-full.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      # 仅构建（手动触发且未勾选 create_release）：保留 artifact 供人工取回测试，
      # 不上传 Release。
      - name: Upload build artifact (inspection only)
        if: >-
          needs.prepare.outputs.is_release != 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: actions/upload-artifact@v7
        with:
          name: DouyinLiveRecorder-${{ matrix.platform }}
          path: dist/*.zip
          compression-level: 0        # zip 已压缩，跳过二次压缩以加速上传
          if-no-files-found: error
          retention-days: 30

  # ── 2. 创建 GitHub Release（tag 推送，或手动触发且勾选 create_release）──
  release:
    name: Create GitHub Release
    needs: [prepare, build]
    if: >-
      needs.prepare.outputs.is_release == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # 收尾写 Release 附件（build job 也已具备写权限用于直传）
    steps:
      - name: Set release tag
        id: tag
        shell: bash
        run: echo "tag=v${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"

      # build job 已把 zip 直传 Release，这里用 gh CLI 把已发布附件拉回本地做校验，
      # 不再经过 upload/download-artifact 的来回。
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release download "${{ steps.tag.outputs.tag }}" -D artifacts --repo "$GITHUB_REPOSITORY"

      - name: List downloaded artifacts
        shell: bash
        run: ls -lh artifacts/

      # 校验产物齐全：3 平台 × (lite + full) = 6 个 zip。
      # 缺失说明某平台构建被跳过或上传失败，此时不应发布残缺 Release。
      - name: Verify artifact completeness
        shell: bash
        run: |
          set -euo pipefail
          count=$(find artifacts -name '*.zip' -type f | wc -l)
          echo "找到 ${count} 个 zip 产物"
          find artifacts -name '*.zip' -type f | sort
          if [ "$count" -lt 6 ]; then
            echo "::error::产物数量不足（期望 6 个：windows/linux/macos × lite/full，实际 ${count} 个）"
            exit 1
          fi

      # 提供校验和便于用户验证下载完整性
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.zip | tee SHA256SUMS.txt

      # 收尾：build job 已直传 6 个 zip，这里仅补充 SHA256SUMS 附件并写发版说明。
      # 不重复列 *.zip（已存在），仅追加校验和文件，避免重复上传。
      - name: Finalize Release (notes + checksums)
        uses: softprops/action-gh-release@v3
        with:
          # 显式指定 tag_name，与 release-create / build 上传三处保持一致
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          files: |
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            ## DouyinLiveRecorder v${{ needs.prepare.outputs.version }}

            ### 下载说明

            | 版本 | 说明 |
            | --- | --- |
            | `*-lite.zip` | 精简版，**不含** ffmpeg / Node.js，首次运行时按需自动下载（体积小） |
            | `*-full.zip` | 完整版，已内置 ffmpeg + Node.js，解压即用（适合内网 / 无外网环境） |

            按操作系统与架构选择对应文件；下载后可用 `SHA256SUMS.txt` 校验完整性：

            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            > 产物由 GitHub Actions 在 `windows-latest` / `ubuntu-latest` / `macos-latest`
            > 上经 `build_exe.py --smoke --dual` 构建，并已通过 CLI / Web / GUI 三入口启动冒烟测试。
            > 可执行文件**未做代码签名**，首次运行时系统可能提示未知发布者。

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "### Release 已创建"
            echo ""
            echo "- 版本：\`v${{ needs.prepare.outputs.version }}\`"
            echo "- 产物：见 Release 附件（含 SHA256SUMS.txt）"
          } >> "$GITHUB_STEP_SUMMARY"