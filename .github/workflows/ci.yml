# =============================================================================
# CI —— 静态检查 / 类型检查 / 测试 / 构建验证
# -----------------------------------------------------------------------------
# 技术栈事实（本文件所有步骤均按此适配，勿凭猜测改动）：
#   · 纯 Python 项目（requires-python >= 3.14，target py314），**无前端构建**
#     —— web/ 仅为 FastAPI 的静态资源（index.html / app.js / style.css），
#        仓库内不存在 package.json / lock 文件，故 **不需要 npm ci / node build**。
#   · Node.js 仅作为「JS 签名脚本运行时」：src/javascript/*.js 由 exejs / PyExecJS
#     调起，src/node_install.py 负责探测与自动下载 —— 因此 CI 只需保证 node 可执行，
#     而非构建前端。
#   · 依赖管理为单源双写：requirements.txt（运行时）与 pyproject.toml
#     [project.optional-dependencies]（dev / gui / build）。**没有 lock 文件**
#     （uv.lock 仅随仓库分发，镜像/CI 均用 pip 走 requirements.txt，不消费它），
#     故 pip 缓存 key 以这两个文件的 hash 为准。
#   · 打包由根目录 build_exe.py（PyInstaller）承担，本地与 CI 行为一致。
#
# Job 拓扑（lint / audit / type / test / build 七路并行 + Windows VBS 行为锁，收尾串行汇总）：
#
#   setup ──┬── static             格式 / 导入序 / 版本一致性 / 派生元数据一致性 / 运行时钉定表结构 / i18n po-mo 同步
#           ├── deps-audit         pip-audit 按 OSV 审计 requirements.txt（补-05）
#           ├── typecheck          mypy（最低支持版本 3.14；范围取 pyproject [tool.mypy].files）
#           ├── test               pytest 矩阵（3.14）+ 全局与逐模块覆盖率门禁 + Web 面板 HTTP 冒烟
#           ├── concurrency-test   线程安全 / 跨事件循环锁 / 速率限制专项
#           ├── integration-verify ffmpeg / node 真实环境探测验证
#           └── build-verify       PyInstaller lite 打包 + CLI/Web/GUI 三入口冒烟
#   StopRecording.vbs ──── vbs-behavior-test  Windows runner，仅 VBS 变更时触发
#                            └────► ci-summary（唯一 required check，汇总上游结果）
#
#   职责边界：**本工作流止于验证，不含部署 / 发布**——Release 产出由
#   build-release.yml（tag 触发）承担；两者的版本常量与打包解释器经各自的
#   consts 步骤保持同值（python_build / node_version），改一处须同步另一处。
#
# ---------------------------------------------------------------------------
# 统一策略（全 job 生效，勿在个别 job 内局部偏离）：
#   · actions 大版本：checkout@v7 / setup-python@v7 / setup-node@v7 /
#     upload-artifact@v7 —— 与 build-release.yml 完全一致，避免两份工作流
#     各自漂移出不同版本的 action 行为。
#   · 依赖缓存：统一 setup-python 内置 pip 缓存，key =
#     hash(requirements.txt + pyproject.toml)（无 lock 文件）；setup-node
#     不开缓存（仓库无 package.json，开了会直接报错）。
#   · 超时：每个 job 显式 timeout-minutes（含 setup / summary 轻量 job），
#     卡死不再白烧默认 6 小时额度。
#   · 网络重试：pip / apt 安装统一经 .github/actions/retry 复合动作
#     （线性退避 ×3），实现收敛在 action.yml 一处，勿在 job 内重新内联。
#   · apt 强化参数（与 build-release.yml 的 Linux 构建一致）：
#     DEBIAN_FRONTEND=noninteractive（防交互卡死）+ Acquire::Retries=3
#     （apt 自身网络重试）+ --no-install-recommends（免装推荐包，更快更省盘）。
#
# ---------------------------------------------------------------------------
# 已关闭的残余缺口
# ---------------------------------------------------------------------------
#   · tests/test_stop_recording_vbs.py 的 4 条 cscript 行为锁（:167/:178/:192/:201）
#     现已由 vbs-behavior-test job 覆盖：仅当 StopRecording.vbs 变更时在 windows-latest
#     触发，用 cscript 驱动真函数原文验证进程匹配判据（按映像名/命令行/父进程三层匹配、
#     先杀主进程后清孤儿 ffmpeg）。同一文件里的静态/AST 类断言（编码 UTF-16 LE、进程名
#     清单与 build_exe.py 对齐等）在 ubuntu 的 test job 中照常执行。
#
# ---------------------------------------------------------------------------
# 环境变量与 Secrets 说明
# ---------------------------------------------------------------------------
#   本工作流 **默认不需要自定义 secret**；仅 Codecov 上传为可选能力（见下文
#   secrets.CODECOV_TOKEN 说明），未配置时对应步骤自动跳过。其余步骤均使用公共资源：
#     · GITHUB_TOKEN        —— Actions 自动注入，此处仅被 actions/checkout 隐式使用，
#                              无需在 with.token 显式传递；权限已按最小化收敛为 contents: read。
#     · COVERAGE_RCFILE     —— 仅 concurrency-test job 使用，指向仓库内
#                              .coveragerc-concurrency（并发测试不设全局覆盖率下限）。
#     · DOUYIN_SKIP_RUNTIME_CHECK / DOUYIN_LOG_NO_ENQUEUE
#                           —— 由 tests/conftest.py 自动 setdefault，无需在此声明。
#     · DISPLAY             —— build-verify job 由 xvfb-run 注入（GUI 冒烟）；test job 的
#                              Qt 用例走 offscreen 后端，不依赖 DISPLAY。
#     · secrets.CODECOV_TOKEN —— 可选：test job 的覆盖率上传步骤仅在「已配置该 secret
#                              且为最低支持版本」时运行；未配置则自动跳过，不阻断 CI。
#                              公开仓库也可不配置（Codecov 可从 commit 关联推断），配置后
#                              报告更可靠。使用浮动主版本 codecov/codecov-action@v7。
#                              **传参口径（MIN-2263）**：该 secret 只以 step 级 env 出现在
#                              「Detect Codecov token」与「Upload coverage to Codecov」两步，
#                              test job 不再有 job 级 env——否则 token 会进入 pytest（执行
#                              仓库测试代码）与 pip 安装的第三方包所在的整棵进程树。
# =============================================================================

name: CI

on:
  # [2026-10-17 修订] 改为**仅手动触发**：push 与 pull_request 两类自动触发已移除，
  # 现在只有人在 Actions 页面点 Run workflow（或 gh workflow run / REST API）才会执行。
  # [历史注] 原口径「触发范围固定 main，push 与 PR 都收敛到主干」随本次改动作废（2026-10-17）。
  # 连带副作用（改完必须同步处理，否则合并会被卡死）：ci-summary 若在分支保护里被勾为
  # required check，而 CI 不再由 PR 触发，它就永远拿不到本次 PR 的新结果 → 状态停在
  # pending 或沿用旧结论。请到 Settings → Branches 摘掉该 required check，或改回 PR 触发。
  workflow_dispatch:

# 最小权限：CI 只读仓库内容即可（发布权限在 build-release.yml 中单独授予）
permissions:
  contents: read

# 同一分支/PR 的新推送会取消尚未完成的旧运行，节省额度并加快反馈
# （与 build-release.yml 的 cancel-in-progress: false 有意区分：发布流不可半途取消）
# [2026-10-17 补] 改为仅手动触发后，同一 ref 上重复点 Run workflow 仍会取消上一次未完成
# 运行——保留该语义是有意的：全量门禁一轮约 20+ 分钟，并发跑两份没有意义。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. 统一常量 ───────────────────────────────────────────────────────────
  # [2026-10-17] 原小节名「统一常量 + 路径过滤」：路径过滤步骤已移除，此处只声明常量。
  # 版本常量放在 job outputs 而非 workflow env：因为 GitHub Actions 的
  # strategy.matrix **无法引用 env 上下文**，但可以引用 needs 上下文。
  # 这样矩阵与普通步骤共用同一份版本定义，彻底避免版本漂移。
  setup:
    name: Setup (constants)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # —— 运行环境版本（与 build-release.yml 同值）——
      python_min: ${{ steps.consts.outputs.python_min }}
      python_latest: ${{ steps.consts.outputs.python_latest }}
      python_matrix: ${{ steps.consts.outputs.python_matrix }}
      python_build: ${{ steps.consts.outputs.python_build }}
      node_version: ${{ steps.consts.outputs.node_version }}
      # —— 静态检查工具固定版本（见 consts 步骤内注释）——
      black_version: ${{ steps.consts.outputs.black_version }}
      isort_version: ${{ steps.consts.outputs.isort_version }}
      mypy_version: ${{ steps.consts.outputs.mypy_version }}
      pytest_version: ${{ steps.consts.outputs.pytest_version }}
      # [2026-10-17] 原「—— 路径过滤结果 —— filters: ${{ steps.filter.outputs.changes }}」
      # 输出随 dorny/paths-filter 一并移除：手动触发场景下该过滤只会制造假绿，理由见下方历史注。
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Declare shared constants
        id: consts
        shell: bash
        run: |
          set -euo pipefail
          # python_min     : 最低支持版本，用作 mypy 目标与覆盖率门禁基准版本
          # python_latest  : 最高支持版本，用作格式化检查（与 black target-version 上界对齐）
          # python_matrix  : 测试矩阵固定 3.14 —— requires-python = ">=3.14" 且全库使用
          #                  PEP 758 无括号多异常语法（except A, B:），3.13 及以下连
          #                  解析都过不了，加入低版本矩阵只会常红；未来扩展新版本时
          #                  仅改此一处（python_min / python_latest 同步更新）。
          # python_build   : 打包解释器版本，**必须与 build-release.yml 的 python_build 同值**，
          #                  保证「CI 验证的打包环境」等于「实际发布的打包环境」。
          # node_version   : 仅供 JS 签名脚本运行时探测使用（非前端构建）
          {
            echo "python_min=3.14"
            echo "python_latest=3.14"
            echo 'python_matrix=["3.14"]'
            echo "python_build=3.14"
            echo "node_version=24"
          } >> "$GITHUB_OUTPUT"

          # 静态检查工具**固定版本**：black / isort 的新大版本会改变格式化结果，
          # 不固定会导致「代码未改动却突然 CI 变红」。此处集中声明便于统一升级
          # （dependabot 不会更新 workflow 内联的 pip 版本，需人工随 pyproject 一起 bump）。
          # pytest 同属此类：typecheck job 靠它把 tests/ 里的 pytest.* 按真实类型检查，
          # 版本漂移会直接改变类型结论（与 black / isort 同一「代码未改动却 CI 变红」形态）。
          # 四个值须与本地 .venv 实装版本**逐一同值**（AGENTS.md「格式化命令」的可外推前提），
          # 否则「本地门禁全绿」不等于「CI 会绿」。isort 现 9.0.2 = 本机实装（2026-10-04 抬，
          # 原 9.0.1 与本地差一个补丁位）；black 现 26.10.1 = 本机实装（2026-10-17 抬，原 26.5.1）——
          # 抬之前已用 26.5.1 与 26.10.1 两个版本各自全量跑过一次 --check，两版结论逐字相同
          # （当时 239 files unchanged，本轮收尾复跑 242），即这次抬值不改变判定，只消除「本地≠CI 版本」的外推缺口。
          # [2026-10-31 抬值] mypy 2.4.0 → 2.4.1、pytest 9.1.1 → 9.2.0：两者均为 PyPI 当日最新版，
          # 且与本机 .venv 实装逐一同值。抬值前用这两版跑过完整门禁：mypy 本机与 --platform linux
          # 均 245 source files / 0 issues；pytest 4764 passed / 16 skipped / 0 warnings；black 246 files
          # unchanged、isort rc=0（black / isort 已是当日最新，无需变）。
          # 同一组版本还写进 .pre-commit-config.yaml 的两个 mirror rev（三面收敛为一面）：
          # 三处任一处单独抬，就会造出「pre-commit 用 A 版本格式化、CI 用 B 版本判定」的互擦。
          {
            echo "black_version=26.10.1"
            echo "isort_version=9.0.2"
            echo "mypy_version=2.4.1"
            echo "pytest_version=9.2.0"
          } >> "$GITHUB_OUTPUT"

      # [2026-10-17 修订] 原「Detect path changes」步骤（dorny/paths-filter@v4）已整体移除。
      # 理由：workflow_dispatch 事件没有 push/PR 的 before/after 基线，该动作只能退化为
      # 「对比上一次成功运行的 SHA」——这个基线与用户点击时手上的代码无关，一旦把 python 组
      # 判成 unchanged，static / typecheck / test 等 job 会被整片跳过，而 ci-summary 视
      # skipped 为通过，于是「手动点了全量门禁、实际一个检查都没跑」还显示绿——与 AGENTS.md
      # 「skipped 与 passed 在汇总里不可区分」同一形态的假绿，必须消灭。手动触发的语义本来
      # 就是「跑全量」，故不再做路径过滤。
      # [历史注] 原过滤口径（2026-09-20 定稿）为：src/**、tests/**、scripts/**、i18n/**、
      # web/**、根五个入口（main/gui/web/i18n/msg_push.py）、requirements.txt、pyproject.toml、
      # uv.lock、DouyinLiveRecorder.egg-info/**、.coveragerc-concurrency、Dockerfile、
      # docker-compose.yaml、.github/workflows/**、.github/actions/**、StopRecording.vbs
      # 归入 python 组；StopRecording.vbs + tests/test_stop_recording_vbs.py 另归 vbs 组，
      # 单独驱动 windows-latest 上的 cscript 行为锁 job。纯 *.md 文档变更不触发。

  # ── 1. 静态检查（格式 / 导入序 / 版本一致性 / 钉定表结构 / 翻译同步 / 注释规范）─
  # 各项检查都是「秒级、零运行时依赖」，合并进同一 job 可省去多次 runner 冷启动
  # （约 30~60s），同时用独立 step 名保留清晰的失败归因。
  static:
    name: Static Checks (black / isort / version / pins / i18n / annotations)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ needs.setup.outputs.python_latest }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.python_latest }}
          # 内置 pip 缓存：无 lock 文件，故以 requirements.txt + pyproject.toml 为 key
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # 版本号在调用处的 with 里展开为字面量，再进入 retry 动作执行（无隐式 env 依赖）
      - name: Install lint tools
        uses: ./.github/actions/retry
        with:
          label: pip 安装 lint 工具（black / isort）
          command: >-
            python -m pip install --upgrade pip
            && pip install "black==${{ needs.setup.outputs.black_version }}" "isort==${{ needs.setup.outputs.isort_version }}"

      # 门禁显式传参（AGENTS.md 约定）：line-length / target-version / profile 不经
      # 配置文件隐式继承，必须写全；排除目录仍由 pyproject [tool.black].exclude /
      # [tool.isort].extend_skip 声明，此处无需重复传参。
      # PYTHONUTF8=1（MID-63）：非 UTF-8 locale 下 isort 会对含中文注释的文件抛
      # 'gbk' codec 编码错误并**静默跳过**、同时返回 rc=0（Windows 中文环境实测 17 个
      # 自有文件被跳过，含 main.py / src/spider.py），门禁查了个空气。Linux runner 默认
      # UTF-8 不受影响，但仍与 AGENTS.md「格式化命令」块逐字对齐，避免「本地过、CI 红」
      # 的反向漂移。
      - name: Run black --check
        env:
          PYTHONUTF8: "1"
        run: python -m black --check --diff --line-length 120 --target-version py314 .

      - name: Run isort --check
        env:
          PYTHONUTF8: "1"
        run: python -m isort --check-only --diff --profile black --line-length 120 .

      # 「有告警即失败」（MID-63 第二条）：isort/black 的 Unable to parse file 走的是
      # UserWarning 通道，rc 仍为 0，故必须在命令层把它转成硬失败。PYTHONUTF8 已消除
      # 根因，这一层是防回归网（换机器/换 locale 也不会静默漏文件）。
      - name: Gate isort/black silent-skip warnings
        env:
          PYTHONUTF8: "1"
        shell: bash
        run: |
          set -euo pipefail
          out=$(python -m isort --check-only --profile black --line-length 120 . 2>&1 >/dev/null || true)
          if printf '%s' "$out" | grep -q "Unable to parse file"; then
            printf '::error::isort 静默跳过文件（门禁假绿）：\n%s\n' "$out"
            exit 1
          fi
          echo "isort 未跳过任何文件"

      # 校验「版本号单一事实源」：pyproject.toml 为准，
      # main.py / src/web_api.py 动态读取、Dockerfile 经 APP_VERSION 注入
      # （纯标准库实现，无需安装项目依赖）
      - name: Check version consistency
        run: python scripts/check_version.py

      # 校验 ci.yml 与 build-release.yml 的版本常量一致性（python_build / node_version）：
      # 两份 workflow 各自在 consts 步骤声明同一组常量，改一处须同步另一处
      # （AGENTS.md「CI / workflow 约定」）。纯标准库实现，无需安装项目依赖。
      - name: Check workflow version constants consistency
        run: python scripts/check_workflow_constants.py

      # 校验「派生元数据一致性」：uv.lock 与 DouyinLiveRecorder.egg-info 必须从 pyproject.toml
      # 重新生成，不允许手改版本号（手写版本是 4.3.0 -> 4.4.0 那次 egg-info / uv.lock 没跟上的
      # 根因，见 AGENTS.md「关键约定」#1 与 scripts/sync_metadata.py 头部说明）。
      # --check 仅读 uv.lock / egg-info/PKG-INFO / pyproject.toml 做比对：不调用 uv / setuptools、
      # 不联网、无需安装项目依赖，与 tests/test_regression_gates.py 的两条元数据回归锁同口径。
      # 路径过滤已把 uv.lock / egg-info 纳入 python 组，故手动改这两个文件也会触发本步。
      - name: Check generated metadata is in sync with pyproject
        run: python scripts/sync_metadata.py --check

      # 运行时二进制钉定表的**结构**检查（SEV-10）：空表 / 缺平台 / 缺槽位 / 与发布矩阵
      # 漂移即红。--strict（占位值也算失败）只在 build-release.yml 的 prepare 里跑，
      # 否则每个 PR 都会因「官方哈希待人工核实」被弄红。
      - name: Check runtime binary SHA256 pins (structure)
        run: python scripts/check_runtime_pins.py

      # 校验 gettext 翻译同步：改 .po 忘记重编译 .mo 时拦截
      # （.mo 随仓库分发，gettext 运行时只读 .mo；纯标准库实现）
      - name: Check i18n po/mo sync
        run: python scripts/compile_po.py --check

      # 校验注释规范：禁用三引号 docstring（AGENTS.md 硬性约定——docstring 会进 AST，
      # 而 # 注释不会）、注释密度下限、模块头存在性。纯标准库实现，无需装项目依赖。
      # 大批量「只改注释」的改动另可先 --snapshot 建基线、改完 --baseline 验证逻辑未动。
      - name: Check annotation conventions
        run: python scripts/check_annotations.py

      # 校验 Skill 目录与 AGENTS.md「项目级 Skill」表格一致性：
      # 表格条目必须指向存在的目录与 SKILL.md，frontmatter name 必须与目录名一致，
      # SKILL.md 引用的 AGENTS.md 章节必须实际存在。纯标准库实现，无需装项目依赖。
      - name: Check skill-AGENTS.md consistency
        run: python scripts/check_skill_agents_consistency.py

  # ── 1.5 依赖漏洞审计（pip-audit，补-05）────────────────────────────────
  # 本仓运行时清单刻意「只有下限、无上限」（唯一例外 protobuf<8），且 uv.lock 不参与
  # 镜像/CI 安装，于是「声明区间内仍含已知受影响版本」这类问题在既有门禁里完全不可见
  # （starlette 旧下限 0.49.1 就把 CVE-2026-48710 的 <=1.0.0 整段留在合法区间内）。
  # pip-audit 直查 OSV：解析 requirements.txt 到临时环境后逐个比对公告。
  # 刻意只装在本 job（**不进 requirements.txt / [project.dependencies]**：
  # 它是审计工具、不是运行时依赖，与 pytest/black 同理归 dev 侧）。
  # 独立成 job 而非塞进 static：static 只装两个秒级 lint 工具，pip-audit 要解析全部
  # 运行时依赖（分钟级），混在一起会拖慢最常被看的格式门禁，且失败归因会含糊。
  deps-audit:
    name: Dependency audit (pip-audit)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ needs.setup.outputs.python_min }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.python_min }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install pip-audit
        uses: ./.github/actions/retry
        with:
          label: pip 安装 pip-audit
          command: >-
            python -m pip install --upgrade pip
            && pip install pip-audit

      # 审计对象 = 镜像与 CI 实际消费的那份清单（requirements.txt），
      # 而非 pyproject 的 dev/gui/build extras：那些不进运行时。
      # --strict 无需额外传：发现漏洞时 pip-audit 本身即以非 0 退出。
      #
      # PYTHONUTF8=1（与 MID-63 同源，2026-09-21 本地实测补）：pip-audit 解析清单走
      # pip-requirements-parser 的 auto_decode()，它用的是 locale.getpreferredencoding(False)
      # 而不是 UTF-8——非 UTF-8 locale 下会在读 requirements.txt 的中文注释时直接抛
      # UnicodeDecodeError（本机 Windows/GBK 实测 rc=1、崩溃在 decode 而非漏洞判定）。
      # ubuntu runner 默认 UTF-8 不受影响，但仍显式钉住，避免任何换 locale 后「门禁换个死法」。
      - name: Audit runtime requirements against OSV
        env:
          PYTHONUTF8: "1"
        run: pip-audit -r requirements.txt --progress-spinner off --timeout 120

      # 下限复核（2026-09-21 补-05 的实测延伸，**不可删**）：上一步是「解析模式」，
      # 只会把每条 >=X 解析到区间内**最新**版本再审计，因此对「下限自身落在受影响段」
      # 完全失明。本地实测同一条 requirements.txt：解析模式 rc=0（No known vulnerabilities），
      # 而逐项下限 + --no-deps 模式 rc=1，报出 starlette 1.0.1（PYSEC-2026-2280/2281/248/249）
      # 与 protobuf 6.31.1（PYSEC-2026-1805）、h2 4.3.0（PYSEC-2026-3628，2026-09-26 抓出）
      # ——正是本仓「只有下限」清单的风险形态：三次都是「下限自身落在受影响段」，解析模式全瞎。
      # 本步把下限逐条钉成 == 再审计，才真正守住 AGENTS.md「安全下限」条目。
      - name: Audit declared floors against OSV (no resolution)
        env:
          PYTHONUTF8: "1"
        shell: bash
        run: |
          set -euo pipefail
          floors=$(mktemp)
          trap 'rm -f "$floors"' EXIT
          python - "$floors" <<'PY'
          import re, sys, tomllib
          out = []
          for line in open("requirements.txt", encoding="utf-8"):
              spec = line.split("#", 1)[0].strip()
              m = re.match(r"^([A-Za-z0-9_.\[\]-]+)\s*>?=\s*([0-9][0-9a-zA-Z.]*)", spec)
              if m:
                  out.append(f"{m.group(1)}=={m.group(2)}")
          # 取数即随事实源同步：两侧条数必须相等。硬编码下限（旧实现 >=20）会在依赖增删后与事实源
          # 脱节——本轮实测事实源与 requirements 均为 18 条，守卫却要求 >=20，job 一触发必红，且红的
          # 是「守卫自己失效」，与真实漏洞不可区分（CODE_REVIEW_2026-10-29 M-08）。
          expected = len(tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"])
          assert len(out) == expected, f"下限条数与 pyproject 依赖数不一致（requirements={len(out)}, pyproject={expected}）"
          open(sys.argv[1], "w", encoding="utf-8").write("\n".join(out) + "\n")
          print(f"复核 {len(out)} 条声明下限")
          PY
          pip-audit -r "$floors" --no-deps --progress-spinner off --timeout 120

  # ── 2. 静态类型检查 ──────────────────────────────────────────────────────
  # 按 pyproject [tool.mypy] python_version = "3.14" 使用最低支持版本运行，
  # 保证类型结论对最老解释器成立。
  # 平台符号门控双跑（AGENTS.md 约定）已补齐到合并边界：ubuntu runner 裸跑 `mypy` 默认即
  # linux 目标，本 job 再对称增跑一次 `mypy --platform win32`，使 CI 同时覆盖 sys.platform
  # 两侧门控分支——此前 win32 侧只在 Windows 开发机上被顺带检查、合并边界从不验证。
  # 两条命令均不带路径参数、共用同一 [tool.mypy].files 范围（见下方 Run mypy 两步）。
  #
  # 检查范围**不再写在命令行**：pyproject [tool.mypy].files 是唯一事实源
  # （src/ + 根入口 main.py/gui.py/web.py/i18n.py/msg_push.py + build_exe.py +
  # scripts/ + tests/），CI 与本地都直接跑 `mypy` 消费它，避免覆盖面漂移。
  # 早前只跑 `mypy src/` 时，根目录入口的漏 import（如 gui.py 的 logger /
  # session_id 未定义 —— 均为运行时 NameError）完全逃逸，故此处扩到全量代码；
  # tests/ 同步纳入是因为「声明了 `mypy tests/` 门禁却只靠自觉执行」已被证明会漂移。
  typecheck:
    name: Type Check (mypy, py${{ needs.setup.outputs.python_min }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ needs.setup.outputs.python_min }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.python_min }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # pytest 必须一并装：[tool.mypy].files 含 tests/，缺 pytest 时 `import pytest` 解析为
      # Any——tests/ 里的 pytest.* 全部免检不说，连 pytest.fail() 的 NoReturn 都会丢失，
      # mypy 会把「声明了非 None 返回类型、却以 pytest.fail() 收尾」的辅助函数判成 [return]
      # （2026-09-26 实测：tests/test_proto_runtime_compat.py:33 只在 CI 红、本机装了 pytest 恒绿）。
      # 固定版本而非跟随最新版：pytest 的类型标注变化会让 tests/ 在代码未改动时突然转红。
      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          label: pip 安装依赖（requirements + mypy + pytest）
          command: >-
            python -m pip install --upgrade pip
            && pip install -r requirements.txt "mypy==${{ needs.setup.outputs.mypy_version }}" "pytest==${{ needs.setup.outputs.pytest_version }}"

      # 平台双跑第一步：不带路径参数，范围由 pyproject [tool.mypy].files 定义（本地同款命令）；
      # ubuntu runner 上即 linux 目标。
      - name: Run mypy (linux target)
        run: mypy

      # 平台双跑第二步：与上一条对称增跑 win32 目标。win32 专属符号（ctypes.windll、
      # subprocess.STARTUPINFO 等）与 `if sys.platform == "win32":` 门控分支只在 win32 目标下
      # 参与类型检查；同范围、同样不带路径参数。2026-10-02 本机实测 win32 与 linux 判定面逐行一致，
      # 不与既有 `# type: ignore` 冲突。
      - name: Run mypy (win32 target)
        run: mypy --platform win32

  # ── 3. 单元测试 + 覆盖率门禁 ─────────────────────────────────────────────
  test:
    name: Test (pytest, py${{ matrix.python-version }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # MIN-2263：原先此处有 job 级 `env: CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}`，
    # 而全 job 只有「Upload coverage to Codecov」一步消费它。job 级 env 会把该 secret
    # 注入下面**整棵进程树**——包括 pytest 执行的仓库测试代码与 pip 刚装上的第三方包，
    # 任何一个被劫持即可读到 token。现收敛为「消费点局部传参」（与本文件顶部 macOS brew
    # 同一口径）：仅下面的探测步骤与上传步骤各自 step 级 env 拿得到，其余步骤看不到。
    strategy:
      fail-fast: false
      matrix:
        # 矩阵引用 needs 上下文（env 上下文在 strategy 中不可用）
        python-version: ${{ fromJSON(needs.setup.outputs.python_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # MID-2264：前端用例（tests/frontend/*.mjs）由 tests/test_frontend_quality_ui.py
      # 以子进程 `node --test` 驱动，Node 缺失时该模块整体 skip。而 ci-summary 只区分
      # failure / cancelled，**skipped 与 passed 不可区分**——一旦 ubuntu 镜像不再附带
      # node，面板侧断言（含 web/app.js 的 saveConfig 跳过 '***' 这条写入侧防线）会全部
      # 消失而汇总仍绿。故本 job 显式装 node（版本与 build-release.yml 的 node_version
      # 同源，取 setup job 的常量），并在下面用一条兜底步骤断言「该模块不得被跳过」。
      - name: Setup Node.js ${{ needs.setup.outputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.setup.outputs.node_version }}
          # 无 package.json / lock 文件，开启 npm 缓存会直接报错，故不设置 cache

      # 可选能力的前置探测（MIN-2263）：只输出「是否配置了 token」这一布尔值，
      # token 本体仅存在于本步骤进程与下面的上传步骤，不进入 pytest / pip 的进程树。
      - name: Detect Codecov token
        id: codecov
        if: matrix.python-version == needs.setup.outputs.python_min
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        shell: bash
        run: |
          if [ -n "${CODECOV_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # ffmpeg：部分测试会探测 ffmpeg 可用性。tkinter GUI 技术栈已移除，Qt 用例统一走
      # offscreen 后端，故 test job 不再安装 xvfb / 不再启动虚拟显示。
      # Qt 运行库（libegl1 及其 GL/xcb 同族）：GUI 窗口层 2026-10-17 迁 PySide6 后已进入
      # 运行时清单（requirements.txt），pip 装得到 wheel 自带的 Qt .so，但那些 .so 仍 dlopen
      # 一组**系统库**——ubuntu runner 缺 libEGL.so.1 时 `from PySide6.QtGui import ...` 抛
      # ImportError，两个 Qt 测试模块以 collection error 形态把整轮 pytest 打断
      # （2026-10-18 实测：4337 collected / 2 errors → Interrupted，exit code 2，其余用例
      # 一条没跑，覆盖率 xml 与逐模块门禁全部拿不到数据）。装这组库是让窗口层真跑起来的前提，
      # 而不是让它在 CI 上安静地 skip（见下方两道反 skip 闸门）。
      - name: Install ffmpeg + Qt runtime libs (apt)
        uses: ./.github/actions/retry
        with:
          label: apt 安装 ffmpeg + Qt 运行库
          command: >-
            sudo env DEBIAN_FRONTEND=noninteractive apt-get update -qq -o Acquire::Retries=3
            && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
            ffmpeg
            libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri
            libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0 libfontconfig1
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      # pytest-asyncio 由 pyproject [tool.pytest.ini_options] asyncio_mode = "auto" 驱动；
      # pytest-cov 必装：scripts/check_coverage.py 依赖其产出的 .coverage 数据文件。
      #
      # black / isort / mypy 同装（版本取 setup job 常量，与 static / typecheck 两个 job 同值）：
      # 门禁脚本的两条回归锁**真起子进程**调用它们——
      #   · tests/test_regression_gates.py::test_run_gates_fatal_patterns_reach_stderr_channel
      #     要用真实 isort 复现「非 UTF-8 源文件 → Unable to parse file 走 UserWarning、rc 仍为 0」；
      #   · tests/test_run_gates.py::test_check_executables_accepts_module_fallback_without_path_scripts
      #     要求 black / mypy 在当前解释器里 importable（验证裸 console-script 不在 PATH 时
      #     run_gates 的 `python -m` 兜底不误报 rc=3）。
      # 缺装时的症状是 `No module named isort` → rc=1 → 用例红（2026-09-26 CI 实测两条红）。
      # 刻意**不**改成「工具缺失就 skip」：那与 MID-2264 同形——skipped 与 passed 在汇总里
      # 不可区分，两条锁会在 ubuntu 上静默消失；装工具才能让它们真的在 CI 上执行。
      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          label: pip 安装依赖（requirements + pytest + 门禁工具）
          command: >-
            python -m pip install --upgrade pip
            && pip install -r requirements.txt pytest pytest-asyncio pytest-cov
            "black==${{ needs.setup.outputs.black_version }}"
            "isort==${{ needs.setup.outputs.isort_version }}"
            "mypy==${{ needs.setup.outputs.mypy_version }}"

      # Qt 侧反 skip 兜底（2026-10-18）：两个 Qt 测试模块靠 pytest.importorskip 降级到 skip，
      # 而 ci-summary 分不清 skipped 与 passed —— 一旦上面那组 apt 包被换镜像 / 换源削弱，
      # 窗口层用例会整片 skip 而汇总仍绿，**这正是本次事故想避免的假绿**（事故原始形态是
      # 直接 collection error 中断整轮，用 skip 掩盖它只会更糟）。本步在 pytest 之前先手验证
      # QtGui/QtWidgets 能加载、且离屏后端真能起 QApplication（平台插件缺失时 Qt 在此即 fatal
      # abort），让环境故障当场红在明确的步骤名上。
      # QT_QPA_PLATFORM=offscreen 与 tests/test_gui_qt_*.py 内部的 setdefault 同口径（那两处
      # 用 setdefault 是为了不覆盖外部指定，此处行内写死是为了让本步自身不依赖显示服务器）。
      - name: Assert Qt offscreen platform is usable (GUI window tests must not skip)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Qt offscreen OK', app.platformName())"

      # Qt 用例在各自模块内 setdefault QT_QPA_PLATFORM=offscreen，无需显示服务器。
      # 全局覆盖率下限由 pyproject [tool.coverage.report] fail_under 强制。
      - name: Run pytest with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      # 「有告警即失败」pytest 侧（与上方 isort/black 兜底步骤同一形态）：
      # pyproject filterwarnings 已忽略已知第三方告警，理论上 warnings summary 恒为空。
      # 但若有人新增未过滤的告警、或第三方库升级引入新告警，summary 段会出现但 pytest rc 仍为 0
      # （与 isort「Unable to parse file」走 UserWarning 通道、rc 恒 0 同理）。
      # 注：pytest 的 warnings summary 走 stdout（非 stderr），故此处捕获 stdout。
      - name: Gate pytest warnings summary
        shell: bash
        run: |
          set -euo pipefail
          out=$(python -m pytest -q 2>/dev/null || true)
          if printf '%s' "$out" | grep -q "= warnings summary ="; then
            printf '::error::pytest warnings summary 非空（有告警被吞掉）：\n%s\n' "$out"
            exit 1
          fi
          echo "pytest warnings summary 为空"

      # MID-2264 的第二道防线：断言前端 .mjs 用例的 pytest 包装**真的执行过**（不是被整体 skip）。
      # 四个包装模块（tests/test_frontend_quality_ui.py 驱动 test_quality_ui.mjs；
      # tests/test_frontend_regression_gates.py 驱动 2026-09-22 组 G 回归锁 .mjs；
      # tests/frontend/test_motion.py 驱动 web/motion.js 的动效降级/清理锁 .mjs；
      # tests/frontend/test_auth_reauth.py 驱动认证复验口令窗的 .mjs）在 node 缺失时
      # 按「环境限制口径」整体 skip（AGENTS「前端用例」条目），而 ci-summary 分不清 skipped 与
      # passed —— 面板侧断言（含 web/app.js 里 saveConfig 跳过 '***' 掩码这条写入侧唯一防线）会静默消失。
      # 故本步显式跑这几条 node 驱动入口并断言无 skip。
      # M-28（2026-09-29）事故成因：test_motion.mjs 此前既无 .py 包装、也不在本清单里，而
      # `node --test <文件>` 只跑被点名的那一个文件、不会顺带发现同级其他 .mjs，于是 web/motion.js
      # 的降级/清理回归锁在正常 CI 中从不执行——必须显式加进下方 pytest 的 node-id 清单才闭合。
      # 用 node-id 精确选取而非整模块：test_frontend_quality_ui.py 里另有两条 tasklist 存活探针用例带
      # `skipif(sys.platform != "win32")`，在 ubuntu 上必然 skip——整模块跑会让下面的「有 skip 即红」
      # 判据被这两条平台专属用例误触发（本 job 全程跑在 ubuntu）。只点名这几条「装了 node 就该跑」
      # 的入口，平台无关，判据才干净。
      # 2026-10-02 补：下方清单里 `tests/test_ci_frontend_registration.py` 不驱动任何 .mjs，它反过来比对
      # 「本清单点名的入口」与 `tests/frontend/*.mjs` 的差集——把「新增 .mjs 必须同批登记」从靠人记 +
      # 本机 Hook（`.qoder/` 不随仓库分发）升级成随仓库分发的机检锁。点名进本步骤而不是只靠全量 pytest
      # 收集，是为了让清单与该锁在**同一步**里互相见证：从清单里摘掉它，该锁自身即报红。
      - name: Gate frontend tests not skipped
        shell: bash
        run: |
          set -euo pipefail
          node --version
          if ! out=$(python -m pytest \
            tests/test_frontend_quality_ui.py::test_frontend_quality_ui \
            tests/test_frontend_regression_gates.py::test_frontend_regression_gates \
            tests/frontend/test_motion.py::test_motion_frontend \
            tests/frontend/test_auth_reauth.py::test_auth_reauth \
            tests/test_ci_frontend_registration.py::test_every_frontend_mjs_is_registered \
            -q -rs 2>&1); then
            printf '::error::前端用例执行失败：\n%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -qE '[0-9]+ skipped'; then
            printf '::error::前端用例被跳过（node 不可用或沙箱限制），面板侧断言未执行：\n%s\n' "$out"
            exit 1
          fi
          echo "前端用例已执行且无跳过"

      # Qt 窗口层的第二道防线（2026-10-18 补，与上方前端闸门同形）：上面的
      # 「Assert Qt offscreen platform is usable」只在 pytest **之前**证明 Qt 能 import；
      # 而 importorskip 是模块级生效——若依赖链在别处断掉（换 wheel / 换 runner 镜像），
      # 两个模块会整片 skip 而 pytest rc 仍为 0，ci-summary 照样给绿。这里补一道收集侧闸门。
      # 为什么判在 **collect-only** 而不是把两个模块再跑一遍：
      #   · 要关的洞是「模块级 importorskip 生效 → 整份文件一条用例都不进」，
      #     这正是 `--co` 唯一会报的形态（2026-10-18 用假 PySide6 对照实测：正常 →
      #     "42 tests collected"；缺 Qt → "no tests collected" + 两条 SKIPPED 行）；
      #   · 改成运行态断言「有 skip 即红」会被函数级 skip 误伤——
      #     tests/test_gui_qt_window.py 的 test_language_switch_retranslates 在语言目录
      #     未装载时属**合法降级**而 skip，把它顶成假红没有意义（与上方前端清单刻意避开
      #     Windows-only 用例是同一考虑）。运行结果本身由上面的全量 pytest 步骤把关，
      #     本步只负责「这两个模块的断言不得整片消失」。
      - name: Gate Qt GUI tests are collected (modules must not skip)
        shell: bash
        run: |
          set -euo pipefail
          if ! out=$(python -m pytest tests/test_gui_qt_units.py tests/test_gui_qt_window.py --co -q -rs 2>&1); then
            printf '::error::Qt GUI 用例收集失败：\n%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -qE '[0-9]+ skipped|no tests collected'; then
            printf '::error::Qt GUI 模块整片 skip（Qt 系统库缺失），窗口层断言不会执行：\n%s\n' "$out"
            exit 1
          fi
          echo "Qt GUI 模块已收集用例，无模块级 skip"

      # 逐模块门禁（spider/stream/utils/ttwid/proxy）只需跑一次，
      # 固定在最低支持版本上执行，避免矩阵内重复且结论歧义。
      - name: Per-module coverage gate
        if: matrix.python-version == needs.setup.outputs.python_min
        run: python scripts/check_coverage.py

      - name: Upload coverage report
        if: matrix.python-version == needs.setup.outputs.python_min
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

      # 可选能力：仅在仓库配置了 secrets.CODECOV_TOKEN 时运行（未配置自动跳过，判定来自
      # 上面的 Detect Codecov token 步骤，见 MIN-2263）。
      # 固定在最低支持版本上执行一次，避免矩阵内重复上传；fail_ci_if_error: false
      # 保证 Codecov 服务异常时不会反噬 CI 门禁。使用浮动主版本 @v7
      # （v6 唯一破坏性变更是迁移 node24 运行时，ubuntu-latest 原生支持；inputs 无变化）。
      - name: Upload coverage to Codecov
        if: matrix.python-version == needs.setup.outputs.python_min && steps.codecov.outputs.available == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          # 2026-10-04：slug 从上游 ihmily 改指本仓库 y123ao6。前置条件：Codecov 须为
          # y123ao6/DouyinLiveRecorder 建好项目且 CODECOV_TOKEN 对该项目有效——未配置前上报会
          # 落空（fail_ci_if_error: false 仅保证不反噬 CI 门禁，数据不会被接收）。
          slug: y123ao6/DouyinLiveRecorder

      # ── Web 面板 HTTP 冒烟（运行中的真实服务，非 TestClient）──────────────
      # 动机：pytest 全程用 FastAPI TestClient 且注入了 fake main，从不监听端口——
      # 「面板进程能否真的起来并应答」这条链路（import 期崩溃、路由未注册、鉴权中间件
      # 误挡探活、静态资源目录缺失、uvicorn 绑定失败）此前完全没有门禁。
      # 位置：排在覆盖率相关步骤之后（而非之前），避免冒烟变红时反而压制掉 coverage.xml / Codecov 上报。
      # 与路径过滤同源（scripts/** 与 web.py 变更都会触发 python 过滤），不改变其它 job 的触发语义。
      # 探活目标与断言形态：scripts/smoke_web.json（默认 http://127.0.0.1:8000 的 / 与
      # /health，后者断言 {"status": "ok"}），与 README「Web/接口冒烟测试」章节一致。
      # 启动/就绪等待/断言/收尾均在 scripts/_ci_web_smoke.sh 内，脚本以冒烟退出码退出；
      # 失败时本步骤直接变红（= job 变红），retry 每一轮都会重跑脚本→从零起一个干净面板，
      # 因此重试真能处理「冷启动慢 / 瞬时 HTTP 抖动」这类网络型原因，而不内联 for 循环。
      # 两个环境变量直接写在命令前缀而非 step env：复合动作对调用方 step 级 env 的可见性
      # 无官方保证（见本文件顶部 macOS brew 同理），行内赋值则确定传递给脚本及其 nohup 子进程。
      #   DOUYIN_SKIP_RUNTIME_CHECK=1：导入期跳过 node 子进程检查/自动安装（与 tests/conftest.py
      #     同一口径）。本 job 现已按 MID-2264 装了 Node.js，但该变量仍保留——它的目的不是
      #     「没 node 才跳过」，而是**禁止导入期起子进程/自动下载**，让面板冒烟的失败原因
      #     只有「面板本身起不来」一种。
      #   DOUYIN_DISABLE_LOG_ARCHIVE=1：一次性进程，停止时不改名 logs/* 以免埋掉冒烟输出。
      - name: Web panel smoke test
        if: matrix.python-version == needs.setup.outputs.python_min
        uses: ./.github/actions/retry
        with:
          label: Web 面板 HTTP 冒烟（启动 + 就绪等待 + 接口断言）
          attempts: "2"
          backoff: "5"
          # 2-A：scripts/_ci_web_smoke.sh 忠实透传 smoke_test.py 的退出码（0 通过 / 1 面板故障
          # 可重试 / 2 配置形态畸形）。配置类错误重试无意义（下一轮仍读到同一份坏配置），
          # 命中 2 即带原退出码立刻失败；1（冷启动慢 / 瞬时 HTTP 抖动）仍按上面的 attempts
          # 重试。本文件其余 retry 调用点不传该 input → 列表恒空 → 行为与改动前逐字一致。
          fail_fast_codes: "2"
          command: >-
            DOUYIN_SKIP_RUNTIME_CHECK=1 DOUYIN_DISABLE_LOG_ARCHIVE=1
            bash scripts/_ci_web_smoke.sh

      # 无论冒烟通过与否都留一份机读报告（含实际状态码/耗时/错误行）与面板启动输出：
      # if: always() 保证冒烟步骤变红时工件仍能上传（否则红了看不到断言细节）。
      # 冒烟输出落在 logs/（已 gitignore，不污染工作区）；文件缺失时仅告警不反噬门禁。
      - name: Upload web smoke artifacts
        if: matrix.python-version == needs.setup.outputs.python_min && always()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke-artifacts-py${{ matrix.python-version }}
          path: |
            logs/web-smoke-report.json
            logs/web-panel-smoke.log
          if-no-files-found: warn
          retention-days: 14

  # ── 4. 并发 / 线程安全专项测试 ───────────────────────────────────────────
  # 覆盖「每 room 独立事件循环」模型下的跨循环 asyncio.Lock、跨 await 持有的
  # threading.RLock 去重、速率限制等回归点。此类测试天然只触及并发相关代码，
  # 覆盖率远低于全局阈值，故用 .coveragerc-concurrency（fail_under = 0）。
  concurrency-test:
    name: Concurrency Test (thread safety & rate limit)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ needs.setup.outputs.python_min }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.python_min }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          label: pip 安装依赖（requirements + pytest）
          command: >-
            python -m pip install --upgrade pip
            && pip install -r requirements.txt pytest pytest-asyncio pytest-cov

      - name: Run concurrency tests
        env:
          COVERAGE_RCFILE: .coveragerc-concurrency
        run: |
          python -m pytest \
            tests/test_concurrency_rate_limit.py \
            tests/test_concurrency.py \
            tests/test_async_http_lock.py \
            --cov=src --cov-report=term-missing:skip-covered

      # 并发测试同样跑 pytest，按同一口径纳入「有告警即失败」——
      # 并发代码的协程/线程告警（如 "coroutine was never awaited"）尤其不应被静默吞掉。
      - name: Gate pytest warnings summary (concurrency)
        shell: bash
        run: |
          set -euo pipefail
          out=$(python -m pytest -q \
            tests/test_concurrency_rate_limit.py \
            tests/test_concurrency.py \
            tests/test_async_http_lock.py \
            2>/dev/null || true)
          if printf '%s' "$out" | grep -q "= warnings summary ="; then
            printf '::error::并发测试 warnings summary 非空（有告警被吞掉）：\n%s\n' "$out"
            exit 1
          fi
          echo "并发测试 warnings summary 为空"

  # ── 5. 运行时依赖探测验证（ffmpeg / node）────────────────────────────────
  # 验证 src/ffmpeg_install.py 与 src/node_install.py 的探测逻辑在真实环境成立。
  # 注意：此处的 node 是「JS 签名脚本运行时」，不是前端构建工具链。
  integration-verify:
    name: Integration Verify (ffmpeg & node detection)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python ${{ needs.setup.outputs.python_min }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.python_min }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Setup Node.js ${{ needs.setup.outputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.setup.outputs.node_version }}
          # 无 package.json / lock 文件，开启 npm 缓存会直接报错，故不设置 cache

      # PATH 探测先行（fail fast）：二进制不可用时不必再装 Python 依赖
      - name: Install ffmpeg (apt)
        uses: ./.github/actions/retry
        with:
          label: apt 安装 ffmpeg
          command: >-
            sudo env DEBIAN_FRONTEND=noninteractive apt-get update -qq -o Acquire::Retries=3
            && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Verify binaries are discoverable
        run: |
          ffmpeg -version | head -1
          node --version

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          label: pip 安装依赖（requirements）
          command: >-
            python -m pip install --upgrade pip
            && pip install -r requirements.txt

      - name: Verify src/ffmpeg_install.py detection
        run: |
          python -c "from src.ffmpeg_install import check_ffmpeg_installed; assert check_ffmpeg_installed(), 'ffmpeg not detected'; print('check_ffmpeg_installed() passed')"

      - name: Verify src/node_install.py detection
        run: |
          python -c "from src.node_install import check_nodejs_installed; assert check_nodejs_installed(), 'node not detected'; print('check_nodejs_installed() passed')"

  # ── 6. 构建验证（PyInstaller 打包 + 三入口冒烟）──────────────────────────
  # 与 build-release.yml 共用同一 build_exe.py，但用 --no-runtime --no-zip 跳过
  # ffmpeg/node 下载（约 300MB）与压缩，只验证「能否打出可启动的 exe」，
  # 把发布级别的完整打包留给 build-release.yml，避免每个 PR 付出全量成本。
  # xvfb-run 提供虚拟显示：否则 build_exe.py 的 smoke_gui() 会因无 DISPLAY 跳过，
  # GUI 入口就得不到验证。
  build-verify:
    name: Build Verify (PyInstaller + smoke)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 打包解释器取 setup job 的 python_build（与 build-release.yml 同值），
      # 保证「CI 验证的打包环境」等于「实际发布的打包环境」。
      - name: Setup Python ${{ needs.setup.outputs.python_build }} (packaging interpreter)
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.python_build }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Setup Node.js ${{ needs.setup.outputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.setup.outputs.node_version }}

      # xvfb：GUI（PySide6）冒烟需要虚拟显示（Qt 离屏后端只覆盖测试，冒烟要真实窗口）。
      # Qt 运行库与 test job 同一组：smoke_gui() 起的正是带 PySide6 窗口层的打包产物，
      # 缺 libEGL.so.1 时进程一起来就崩（与 test job 那次 collection error 同源故障面），
      # 而 build_exe.py 的冒烟对「产物打出来了但跑不起来」是宽松的，故在环境侧先补齐。
      - name: Install ffmpeg + xvfb + Qt runtime libs (apt)
        uses: ./.github/actions/retry
        with:
          label: apt 安装 ffmpeg/xvfb/Qt 运行库
          command: >-
            sudo env DEBIAN_FRONTEND=noninteractive apt-get update -qq -o Acquire::Retries=3
            && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
            ffmpeg xvfb
            libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri
            libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0 libfontconfig1
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      # PyInstaller 由 pyproject [project.optional-dependencies].build 声明
      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          label: pip 安装依赖（requirements + build extras）
          command: >-
            python -m pip install --upgrade pip
            && pip install -r requirements.txt
            && pip install ".[build]"

      - name: Build (lite) + smoke test CLI/Web/GUI
        run: xvfb-run -a python build_exe.py --smoke --no-runtime --no-zip

  # ── 7. VBS 行为锁（Windows runner，仅 StopRecording.vbs 变更时触发）──────
  # StopRecording.vbs 的 4 条 cscript 行为用例需要真 Windows cscript 解释器，
  # ubuntu runner 上永远 skip。用 paths 过滤只在 VBS 文件变更时启动 Windows runner，
  # 避免每次 PR 付出 Windows 分钟额度（该脚本变更频率极低，通常只在功能迭代时改动）。
  # 静态/AST 类断言（编码、映像名清单、杀进程顺序等）已在 ubuntu test job 覆盖。
  # [2026-10-17 补] 原「用 paths 过滤只在 VBS 文件变更时启动 Windows runner」的节流手段随
  # 仅手动触发一并取消：现在每次手动触发都起 windows-latest（约 10 分钟）。该节流的前提是
  # [2026-10-18 补] 本 job 原先只装 pytest（`pip install pytest`），2026-10-18 手动触发实测
  #   11 条用例在 setup 阶段全数 ERROR：`ModuleNotFoundError: No module named 'distro'`。
  #   被测文件 tests/test_stop_recording_vbs.py 本身只 import 标准库 + pytest，但
  #   tests/conftest.py 的三个 **autouse** fixture 会在每条用例前 import 被测面：
  #     · _clean_credential_caches → `from src import spider` → src/__init__.py →
  #       src/node_install.py 顶层 `import distro`；
  #     · _hermetic_danmaku_hub → `import src.danmaku_monitor`（同一条 src 导入链）；
  #     · _pin_identity_translation → `import i18n` → i18n.py 顶层 `from loguru import logger`。
  #   即「跑仓库里任何一条 pytest」的门槛是**整份运行时依赖**，而不是被测文件自己的 import。
  #   两条可选修法里选「装齐依赖」而非「给 fixture 加 skip 通道」：后者正是 MIN-2264 反复
  #   拦过的形态（fixture 静默不生效，污染类用例退化成「单独跑通过、整包跑失败」）。
  #   体积代价可接受：本工作流已改为仅手动触发，且 build-release.yml 的 Windows 构建 job
  #   本来就在同一个 runner 镜像上装同一份 requirements.txt。
  vbs-behavior-test:
    name: VBS Behavior Test (Windows cscript)
    needs: setup
    runs-on: windows-latest
    # 10 → 20：装整份 requirements（含 PySide6 这种大 wheel）比只装 pytest 多出数分钟，
    # 超时太紧会把「依赖装到一半」伪装成本 job 的失败。
    timeout-minutes: 20
    # [2026-10-17 修订] 原条件为「github.event_name == 'workflow_dispatch' || vbs 路径命中」。
    # 改为仅手动触发后前半式恒真、后半式引用的 filters 输出已不存在，故整条 if 删除：
    # 现在每次手动触发都会执行这 4 条 cscript 行为锁。
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # 与其它 job 同一口径：装 requirements.txt（conftest 的 autouse fixture 会 import src / i18n，
      #   详见本 job 头部注释）。pytest-asyncio 同装：pyproject 的 asyncio_mode = "auto" 由它提供，
      #   缺装时每次 pytest 启动都会打 PytestConfigWarning: Unknown config option: asyncio_mode
      #   （2026-10-18 实测该 job 的 warnings summary 里就有这一条）。
      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          label: pip 安装依赖（requirements + pytest）
          command: >-
            python -m pip install --upgrade pip
            && pip install -r requirements.txt pytest pytest-asyncio

      - name: Run VBS behavior tests (cscript)
        run: python -m pytest tests/test_stop_recording_vbs.py -v

  # ── 8. 汇总门禁 ─────────────────────────────────────────────────────────
  # [2026-10-17 修订] 路径过滤移除后已无 job 会被跳过，「skipped → 通过」通道实际空转；
  # 判定口径保留，以免将来恢复过滤时本 job 反过来把合法跳过判成失败。
  # [历史注] 原注「上游 job 会被路径过滤跳过，分支保护若直接勾选它们会『永久 pending』」
  # 随过滤器移除作废（2026-10-17）。
  # 对外仍只暴露本 job 作为唯一 required check：
  #   skipped / success → 通过；failure / cancelled → 失败。
  ci-summary:
    name: CI Summary (required check)
    if: always()
    needs:
      - setup
      - static
      - deps-audit
      - typecheck
      - test
      - concurrency-test
      - integration-verify
      - build-verify
      - vbs-behavior-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 使用原生对象过滤器 needs.*.result（GitHub 官方推荐写法），
      # 不引入 jq / 内联脚本，避免 shell 引号陷阱。
      # skipped 视为通过：2026-10-17 起已无 job 会被路径过滤跳过（过滤器已移除），
      # 该判定保留仅为防将来恢复条件 job 时本 job 把合法跳过反噬成失败。
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        shell: bash
        run: |
          echo "::error::存在未通过的上游 job（failure / cancelled），请查看本次运行的 job 列表定位"
          echo "各 job 结果：${{ join(needs.*.result, ', ') }}"
          exit 1

      - name: All checks passed
        shell: bash
        run: |
          echo "✅ 全部 job 通过（或合法跳过）"
          echo "各 job 结果：${{ join(needs.*.result, ', ') }}"
