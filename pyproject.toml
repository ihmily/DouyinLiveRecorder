[project]
name = "DouyinLiveRecorder"
version = "4.0.8.1"
description = "支持抖音、TikTok、YouTube、快手等60+平台的直播录制工具，支持循环录制、多人录制、消息推送"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hmily", email = "ihmily@github" }
]
keywords = [
    "live-streaming",
    "recorder",
    "douyin",
    "tiktok",
    "bilibili",
    "twitch",
    "youtube",
    "直播录制",
    "抖音",
    "虎牙",
    "斗鱼"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: GUI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Win32",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "requests>=2.34.2",
    "loguru>=0.7.3",
    "pycryptodome>=3.23.0",
    "distro>=1.9.0",
    "tqdm>=4.69.0",
    "httpx[http2]>=0.28.1",
    "exejs>=1.0.1",
    "PyExecJS>=1.5.1",
    "customtkinter>=6.0.0",
    "pystray>=0.19.5",
    "Pillow>=12.3.0",
    "fastapi>=0.140.0",
    "starlette>=0.49.1",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]
gui = [
    "customtkinter>=6.0.0",
    "pystray>=0.19.5",
    "Pillow>=12.3.0",
]
# 可执行文件打包（build_exe.py / CI 使用，非运行时依赖）
build = [
    "pyinstaller>=6.10.0",
]

[project.scripts]
douyin-recorder = "main:main"
douyin-recorder-gui = "gui:main"
douyin-recorder-web = "web:main"

[project.urls]
Homepage = "https://github.com/ihmily/DouyinLiveRecorder"
Documentation = "https://github.com/ihmily/DouyinLiveRecorder"
Repository = "https://github.com/ihmily/DouyinLiveRecorder"
Issues = "https://github.com/ihmily/DouyinLiveRecorder/issues"
Changelog = "https://github.com/ihmily/DouyinLiveRecorder/releases"
Sponsor = "https://github.com/sponsors/ihmily"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
# 顶层单文件模块：保证 [project.scripts] 三个入口（main/gui/web）安装后可用
py-modules = ["main", "web", "gui", "gui_legacy", "i18n", "msg_push"]

[tool.setuptools.package-data]
src = ["javascript/*.js"]
# 注：i18n/ 翻译目录不是 Python 包（无 __init__.py），无法通过 package-data 分发；
# .mo 文件随 git 仓库、发布 zip（build_exe.py）与 Docker 镜像分发。

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | __pycache__
    | \.pyc
    | node
    | ffmpeg
    | downloads
    | logs
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["src", "i18n"]
extend_skip = ["node", "ffmpeg", "downloads"]
extend_skip_glob = ["*.pyc"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "node",
    "ffmpeg",
    "downloads",
    "__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/node/*",
    "*/ffmpeg/*",
]

[tool.coverage.report]
fail_under = 20
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
