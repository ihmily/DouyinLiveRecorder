; PHP2Shell stopgap (CVE-2026-109618 / CVE-2026-109619). Not a fix: patch PHP.
; Must load before request parsing (php.ini, conf.d, pool php_admin_*). Restart every worker.
; Closes the confirmed session upload-progress path of CVE-2026-109619. Keep after patching.
session.upload_progress.enabled = 0
; Removes the controllable out-of-memory that CVE-2026-109618 relies on. Pair with a cgroup or
; container memory limit. A pool php_admin_value[memory_limit] = -1 is stronger than this line.
memory_limit = -1
; PHP 8.5 only (ignored elsewhere): the confirmed mod_php producer for CVE-2026-109619.
fatal_error_backtraces = 0
; Reject attacker-supplied session IDs. Hygiene, not in the official workaround list.
session.use_strict_mode = 1
