# Include in the VirtualHost or .htaccess (needs mod_rewrite, AllowOverride FileInfo).
# Returns 403 for multipart/form-data bodies except allow-listed upload paths. Replace the paths.
RewriteEngine On
RewriteCond %{HTTP:Content-Type} multipart/form-data [NC]
RewriteCond %{REQUEST_URI} !^/(wp-admin/async-upload\.php|wp-admin/media-new\.php|upload) [NC]
RewriteRule ^ - [F]
