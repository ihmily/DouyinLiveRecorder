# Include inside a `server {}` block. Returns 403 for multipart/form-data bodies
# everywhere except an explicit allow-list of upload paths. Replace the paths.
# Reload with: nginx -t && nginx -s reload
set $php2shell_block 0;
if ($http_content_type ~* "multipart/form-data") { set $php2shell_block 1; }
if ($request_uri ~* "^/(wp-admin/async-upload\.php|wp-admin/media-new\.php|upload)")  { set $php2shell_block 0; }
if ($php2shell_block) { return 403; }
