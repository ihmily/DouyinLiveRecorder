# ModSecurity v2/v3. Phase 2 so the body is parsed. Tune id range to your ruleset.
# 1) Deny any multipart body that carries the session upload-progress field name
#    (default name; change if session.upload_progress.name was customised).
SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data" \
  "id:9109618,phase:2,chain,deny,status:403,log,msg:'PHP2Shell: session upload-progress field in multipart body',tag:'CVE-2026-109618'"
  SecRule ARGS_NAMES|FILES_NAMES|REQUEST_BODY "@contains PHP_SESSION_UPLOAD_PROGRESS" "t:none"

# 2) Deny multipart bodies to paths that never accept uploads. Replace the allow-list.
SecRule REQUEST_HEADERS:Content-Type "@contains multipart/form-data" \
  "id:9109619,phase:1,chain,deny,status:403,log,msg:'PHP2Shell: multipart POST to non-upload path',tag:'CVE-2026-109619'"
  SecRule REQUEST_URI "!@rx ^/(wp-admin/async-upload\.php|wp-admin/media-new\.php|upload)" "t:none"
